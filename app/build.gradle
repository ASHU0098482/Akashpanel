apply plugin: 'com.android.application'

buildDir = file("C:/Users/ashua/Pictures/AKASHP~1/app/build")

android {
    compileSdkVersion 30
    defaultConfig {
        applicationId "com.akash.panel"
        minSdkVersion 24
        targetSdkVersion 30
        versionCode 29
        versionName "29.0"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/my-release-key-jks.jks")
            storePassword '123456'
            keyAlias 'my-alias'
            keyPassword '123456'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        ndkBuild {
            path file('C:/Users/ashua/Pictures/AKASHP~1/app/src/main/jni/Android.mk')
        }
    }
    ndkVersion '21.4.7075529'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    } // Ajuste conforme necessário



}

//dependencies must be placed below 'android' brackets to get it work on AIDE
dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // ✅ Glide for GIF support
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ✅ AndroidX Core for FileProvider (in-app update install)
    implementation 'androidx.core:core:1.6.0'

    // Shizuku gives the panel ADB-shell access on non-root Android devices.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

}
